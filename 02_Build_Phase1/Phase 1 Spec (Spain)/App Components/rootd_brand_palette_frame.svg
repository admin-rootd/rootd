<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Frame background: color-bg -->
  <rect x="0" y="0" width="1440" height="1024" fill="#FAF7F2"/>

  <!-- Header -->
  <text x="80" y="70" font-size="32" font-weight="700" fill="#22262A">Rootd design tokens</text>
  <text x="80" y="96" font-size="16" fill="#6B7280">Color palette · developer reference</text>

  <!-- Core colors -->
  <text x="80" y="140" font-size="18" font-weight="600" fill="#22262A">Core colors</text>

  <!-- color-primary -->
  <rect x="80" y="160" width="240" height="140" rx="12" fill="#1F4D3A"/>
  <text x="80" y="326" font-size="16" font-weight="600" fill="#22262A">color-primary</text>
  <text x="80" y="348" font-size="14" fill="#22262A">#1F4D3A</text>
  <text x="80" y="370" font-size="13" fill="#6B7280">Buttons, headers, key actions</text>

  <!-- color-secondary -->
  <rect x="340" y="160" width="240" height="140" rx="12" fill="#C8643C"/>
  <text x="340" y="326" font-size="16" font-weight="600" fill="#22262A">color-secondary</text>
  <text x="340" y="348" font-size="14" fill="#22262A">#C8643C</text>
  <text x="340" y="370" font-size="13" fill="#6B7280">Large elements and icons only</text>

  <!-- color-bg -->
  <rect x="600" y="160" width="240" height="140" rx="12" fill="#FAF7F2" stroke="#D1D5DB" stroke-width="1"/>
  <text x="600" y="326" font-size="16" font-weight="600" fill="#22262A">color-bg</text>
  <text x="600" y="348" font-size="14" fill="#22262A">#FAF7F2</text>
  <text x="600" y="370" font-size="13" fill="#6B7280">Screen background</text>

  <!-- color-surface -->
  <rect x="860" y="160" width="240" height="140" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="860" y="326" font-size="16" font-weight="600" fill="#22262A">color-surface</text>
  <text x="860" y="348" font-size="14" fill="#22262A">#FFFFFF</text>
  <text x="860" y="370" font-size="13" fill="#6B7280">Cards and panels</text>

  <!-- color-text -->
  <rect x="1120" y="160" width="240" height="140" rx="12" fill="#22262A"/>
  <text x="1120" y="326" font-size="16" font-weight="600" fill="#22262A">color-text</text>
  <text x="1120" y="348" font-size="14" fill="#22262A">#22262A</text>
  <text x="1120" y="370" font-size="13" fill="#6B7280">Body text</text>

  <!-- Status colors -->
  <text x="80" y="500" font-size="18" font-weight="600" fill="#22262A">Status colors</text>

  <!-- color-status-present -->
  <rect x="80" y="520" width="240" height="120" rx="12" fill="#3E8E63"/>
  <text x="80" y="666" font-size="16" font-weight="600" fill="#22262A">color-status-present</text>
  <text x="80" y="688" font-size="14" fill="#22262A">#3E8E63</text>
  <text x="80" y="710" font-size="13" fill="#6B7280">Document is on file. Badges and icons only</text>

  <!-- color-status-missing -->
  <rect x="340" y="520" width="240" height="120" rx="12" fill="#D99A2B"/>
  <text x="340" y="666" font-size="16" font-weight="600" fill="#22262A">color-status-missing</text>
  <text x="340" y="688" font-size="14" fill="#22262A">#D99A2B</text>
  <text x="340" y="710" font-size="13" fill="#6B7280">Document still needed. Used instead of red</text>

  <!-- color-text-muted -->
  <rect x="860" y="520" width="240" height="120" rx="12" fill="#6B7280"/>
  <text x="860" y="666" font-size="16" font-weight="600" fill="#22262A">color-text-muted</text>
  <text x="860" y="688" font-size="14" fill="#22262A">#6B7280</text>
  <text x="860" y="710" font-size="13" fill="#6B7280">Captions and secondary text</text>

  <!-- color-status-info -->
  <rect x="600" y="520" width="240" height="120" rx="12" fill="#3B6EA5"/>
  <text x="600" y="666" font-size="16" font-weight="600" fill="#22262A">color-status-info</text>
  <text x="600" y="688" font-size="14" fill="#22262A">#3B6EA5</text>
  <text x="600" y="710" font-size="13" fill="#6B7280">Neutral tips and notes</text>

  <!-- Contrast pairs -->
  <text x="80" y="780" font-size="18" font-weight="600" fill="#22262A">Contrast pairs</text>
  <line x1="80" y1="794" x2="1360" y2="794" stroke="#D1D5DB" stroke-width="1"/>
  <text x="80" y="818" font-size="14" font-weight="600" fill="#6B7280">Pair</text>
  <text x="460" y="818" font-size="14" font-weight="600" fill="#6B7280">Ratio</text>
  <text x="560" y="818" font-size="14" font-weight="600" fill="#6B7280">Verdict</text>

  <text x="80" y="846" font-size="14" fill="#22262A">White on primary</text>
  <text x="460" y="846" font-size="14" fill="#22262A">9.6 : 1</text>
  <text x="560" y="846" font-size="14" fill="#22262A">Pass: button text, headers</text>

  <text x="80" y="870" font-size="14" fill="#22262A">Text on background</text>
  <text x="460" y="870" font-size="14" fill="#22262A">14.2 : 1</text>
  <text x="560" y="870" font-size="14" fill="#22262A">Pass: default body text</text>

  <text x="80" y="894" font-size="14" fill="#22262A">Muted on background</text>
  <text x="460" y="894" font-size="14" fill="#22262A">4.5 : 1</text>
  <text x="560" y="894" font-size="14" fill="#22262A">Pass, barely: not on tinted fills</text>

  <text x="80" y="918" font-size="14" fill="#22262A">Secondary on background</text>
  <text x="460" y="918" font-size="14" fill="#22262A">3.7 : 1</text>
  <text x="560" y="918" font-size="14" fill="#22262A">Fails small text: large text, icons only</text>

  <text x="80" y="942" font-size="14" fill="#22262A">Present on background</text>
  <text x="460" y="942" font-size="14" fill="#22262A">3.7 : 1</text>
  <text x="560" y="942" font-size="14" fill="#22262A">Fails small text: badges, icons only</text>

  <text x="80" y="966" font-size="14" fill="#22262A">Charcoal on missing</text>
  <text x="460" y="966" font-size="14" fill="#22262A">6.2 : 1</text>
  <text x="560" y="966" font-size="14" fill="#22262A">Pass: never use white on amber</text>

  <!-- Footer rule -->
  <text x="80" y="1000" font-size="13" fill="#6B7280">Label wording: always 'present' / 'missing', never 'valid' / 'invalid'. Ratios approximate; recheck in build.</text>
</svg>
